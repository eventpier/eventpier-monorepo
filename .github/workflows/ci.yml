name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Testes unitários
        run: pnpm --filter @eventpier/provider-aws test

      - name: Build
        run: |
          pnpm --filter @eventpier/contracts build
          pnpm --filter @eventpier/provider-aws build
          pnpm --filter @eventpier/ui build

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Docker build
        run: docker compose build

      - name: Testes de integração (scripts de validação estrutural)
        run: |
          node scripts/validate-workspace-manifests.mjs
          node scripts/validate-workspace-dependencies.mjs
          node scripts/validate-contract-constants.mjs
          node scripts/validate-compose-shape.mjs
          node scripts/validate-ci-workflow-shape.mjs
          node scripts/validate-manifest-endpoint.mjs
